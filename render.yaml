# Free-tier evaluation deployment: local writes reset on sleep/restart.
# Bundled company data is restored at each fresh service startup.
services:
  - type: web
    name: finn
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.serve --host 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FINN_DATA_DIR
        value: /tmp/finn
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
